name: Backend CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bid-backend
  SERVICE_NAME: carramarket-backend
  CONTAINER_PORT: 8080
  HEALTH_ENDPOINT: /health

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run vet
        run: go vet ./...

      - name: Run tests with race detection
        run: go test -v -race -timeout 5m ./...

  docker:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_uri: ${{ steps.image-uri.outputs.uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Target Image URI
        id: image-uri
        run: |
          echo "uri=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy Backend via Docker Compose
    needs: docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASS: ${{ secrets.GITHUB_TOKEN }}
          CLIENT_API_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: REGISTRY,REGISTRY_USER,REGISTRY_PASS,CLIENT_API_TAG
          script_stop: true
          script: |
            echo "=========================================================="
            echo "🚀 Starting Deployment for Backend ($CLIENT_API_TAG)"
            echo "=========================================================="

            # Authenticate with container registry
            echo "$REGISTRY_PASS" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

            cd /home/ubuntu/carramarket

            # Export tag and pull new image
            export CLIENT_API_TAG="$CLIENT_API_TAG"
            echo "⬇️ Pulling new backend image ($CLIENT_API_TAG)..."

            # containerd image-store can fail intermittently with:
            #   "lease does not exist: not found"
            # Retry a few times before failing the deploy.
            pull_ok=0
            for attempt in 1 2 3 4 5; do
              if docker compose pull backend; then
                pull_ok=1
                break
              fi
              echo "⚠️ Pull attempt $attempt failed; waiting before retry..."
              sleep $((attempt * 3))
            done
            if [ "$pull_ok" != "1" ]; then
              echo "❌ docker compose pull backend failed after retries"
              docker images | head -n 30 || true
              exit 1
            fi

            # Recreate backend container
            echo "▶️ Updating backend container..."
            docker compose up -d --force-recreate backend

            # Quick status check
            sleep 3
            docker compose ps backend

            # Prune AFTER deploy only (never during pull — races with leases)
            docker image prune -f --filter "until=24h" || true

            echo "=========================================================="
            echo "✨ Backend deployed successfully via Docker Compose!"
            echo "=========================================================="
